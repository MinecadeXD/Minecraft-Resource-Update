<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Deploy</title>
  <style>
    :root {
      color-scheme: dark;
      --red: #ff4d68;
      --green: #54f2a1;
      --blue: #5796ff;
      --text: #f4f6fb;
      --muted: #8f98aa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      background: #080a10;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .ambient {
      position: fixed;
      inset: -20%;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 17% 32%, #ff31531f 0, transparent 35%),
        radial-gradient(ellipse at 82% 68%, #3dff9b1c 0, transparent 35%),
        radial-gradient(ellipse at 53% 9%, #4288ff25 0, transparent 38%);
      filter: blur(28px);
      animation: drift 14s ease-in-out infinite alternate;
    }
    .panel {
      position: relative;
      width: min(100%, 440px);
      padding: 30px;
      border: 1px solid #ffffff18;
      border-radius: 28px;
      background: linear-gradient(145deg, #ffffff0d, #ffffff04 58%, #5796ff08);
      box-shadow: 0 28px 90px #0009, inset 0 1px #ffffff13;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      animation: appear .7s cubic-bezier(.2,.8,.2,1) both;
    }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
    .lights { display: flex; gap: 7px; }
    .light { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 12px currentColor; }
    .light.red { color: var(--red); background: currentColor; }
    .light.green { color: var(--green); background: currentColor; }
    .light.blue { color: var(--blue); background: currentColor; }
    .status {
      display: inline-flex; align-items: center; gap: 8px;
      color: #c5ccda; font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px #54f2a1aa; }
    .status.busy .status-dot { background: var(--blue); box-shadow: 0 0 10px #5796ffaa; animation: pulse 1s infinite; }
    .status.error .status-dot { background: var(--red); box-shadow: 0 0 10px #ff4d68aa; }
    .deploy-wrap { position: relative; margin: 12px 0 25px; }
    .deploy-wrap::before {
      content: ""; position: absolute; inset: -2px; border-radius: 20px;
      background: linear-gradient(105deg, var(--red), var(--blue) 48%, var(--green));
      opacity: .75; filter: blur(15px); transition: opacity .25s, filter .25s;
    }
    .deploy {
      position: relative; display: flex; width: 100%; min-height: 74px; align-items: center; justify-content: center; gap: 13px;
      border: 1px solid #ffffff35; border-radius: 18px; cursor: pointer;
      color: white; font: inherit; font-size: 17px; font-weight: 680; letter-spacing: .01em;
      background: linear-gradient(110deg, #ff4d6820, #5796ff26 48%, #54f2a11b), #151923;
      box-shadow: inset 0 1px #ffffff20, 0 8px 30px #0006;
      transition: transform .22s ease, border-color .22s ease, background .22s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .deploy:hover:not(:disabled) { transform: translateY(-2px); border-color: #ffffff70; background: linear-gradient(110deg, #ff4d6833, #5796ff38 48%, #54f2a12b), #191e2a; }
    .deploy-wrap:has(.deploy:hover:not(:disabled))::before { opacity: 1; filter: blur(19px); }
    .deploy:active:not(:disabled) { transform: translateY(1px) scale(.99); }
    .deploy:focus-visible { outline: 2px solid white; outline-offset: 5px; }
    .deploy:disabled { cursor: wait; opacity: .8; }
    .arrow { font-size: 22px; line-height: 1; transition: transform .2s ease; }
    .deploy:hover .arrow { transform: translateX(4px); }
    .activity {
      display: flex; align-items: flex-start; gap: 12px; padding: 15px;
      border: 1px solid #ffffff0e; border-radius: 16px; background: #00000020;
    }
    .activity-icon {
      flex: 0 0 30px; width: 30px; height: 30px; display: grid; place-items: center;
      border-radius: 10px; color: var(--blue); background: #5796ff12;
    }
    .activity-icon.success { color: var(--green); background: #54f2a112; }
    .activity-icon.error { color: var(--red); background: #ff4d6812; }
    .activity-copy { min-width: 0; flex: 1; }
    .activity-title { margin: 1px 0 5px; font-size: 13px; font-weight: 600; }
    .activity-message { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; overflow-wrap: anywhere; }
    .time { margin-top: 10px; color: #697386; font-size: 10px; letter-spacing: .04em; }
    @keyframes drift { from { transform: translate3d(-1%, -1%, 0) scale(1); } to { transform: translate3d(1%, 1%, 0) scale(1.06); } }
    @keyframes appear { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes pulse { 50% { opacity: .35; } }
    @media (max-width: 420px) { .panel { padding: 23px; border-radius: 24px; } .deploy { min-height: 68px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main class="panel">
    <div class="topline">
      <div class="lights" aria-hidden="true"><span class="light red"></span><span class="light green"></span><span class="light blue"></span></div>
      <div class="status" id="status"><span class="status-dot"></span><span id="statusText">Ready</span></div>
    </div>

    <div class="deploy-wrap">
      <button class="deploy" id="deployButton" type="button">
        <span id="buttonText">Deploy Now</span><span class="arrow" aria-hidden="true">↗</span>
      </button>
    </div>

    <section class="activity" aria-live="polite" aria-atomic="true">
      <div class="activity-icon" id="activityIcon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3m0 12v3M3 12h3m12 0h3"/><circle cx="12" cy="12" r="5"/></svg>
      </div>
      <div class="activity-copy">
        <p class="activity-title" id="activityTitle">Standing by</p>
        <p class="activity-message" id="activityMessage">Ready when you are.</p>
        <div class="time" id="attemptTime">No attempts yet</div>
      </div>
    </section>
  </main>

  <script>
    // Replace this placeholder with your webhook URL before use.
    const WEBHOOK_URL = "PASTE_YOUR_COPIED_BUDDY_WEBHOOK_URL_HERE";

    const deployButton = document.getElementById("deployButton");
    const buttonText = document.getElementById("buttonText");
    const status = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const activityIcon = document.getElementById("activityIcon");
    const activityTitle = document.getElementById("activityTitle");
    const activityMessage = document.getElementById("activityMessage");
    const attemptTime = document.getElementById("attemptTime");

    function setStatus(state, label, title, message) {
      status.className = "status" + (state === "busy" ? " busy" : state === "error" ? " error" : "");
      statusText.textContent = label;
      activityIcon.className = "activity-icon" + (state === "success" ? " success" : state === "error" ? " error" : "");
      activityTitle.textContent = title;
      activityMessage.textContent = message;
    }

    deployButton.addEventListener("click", async () => {
      if (deployButton.disabled) return;
      if (!WEBHOOK_URL || WEBHOOK_URL === "PASTE_YOUR_COPIED_BUDDY_WEBHOOK_URL_HERE") {
        setStatus("error", "Setup needed", "Webhook URL missing", "Replace the placeholder in index.html with your webhook URL.");
        attemptTime.textContent = "Not sent · " + new Date().toLocaleString();
        return;
      }

      deployButton.disabled = true;
      buttonText.textContent = "Deploying…";
      setStatus("busy", "Sending", "Request in progress", "Sending the deploy request to the webhook.");
      attemptTime.textContent = "Attempted · " + new Date().toLocaleString();

      try {
        const response = await fetch(WEBHOOK_URL, { method: "POST" });
        if (response.ok) {
          setStatus("success", "Request accepted", "Webhook request sent", "The endpoint returned HTTP " + response.status + ".");
        } else {
          setStatus("error", "Request failed", "Webhook returned an error", "The endpoint returned HTTP " + response.status + ".");
        }
      } catch (error) {
        setStatus("error", "Connection issue", "Could not confirm the request", "The browser blocked the request or could not reach the endpoint. Check the webhook URL and CORS support.");
      } finally {
        deployButton.disabled = false;
        buttonText.textContent = "Deploy Now";
      }
    });
  </script>
</body>
</html>
